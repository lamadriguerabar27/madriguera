# Despliegue en Render (https://render.com): New > Blueprint > elige este repositorio.
services:
  - type: web
    name: madriguera
    runtime: docker
    plan: free
    healthCheckPath: /api/salud/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: madriguera-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: madriguera-db
    plan: free
    databaseName: madriguera
